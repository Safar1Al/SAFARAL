
name: Build SafarAI Global - PlayStore Ready
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Safar50
        run: |
          if [ -f Safar50-project.zip ]; then unzip -o Safar50-project.zip -d .; fi
          ls -la
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Auto Keystore
        run: |
          mkdir -p app
          if [ ! -f app/release.jks ]; then keytool -genkey -v -keystore app/release.jks -alias safaral -keyalg RSA -keysize 2048 -validity 10000 -storepass SafarAL123 -keypass SafarAL123 -dname "CN=SafarAI, O=SafarAL, C=SD"; fi
      - name: Build AAB+APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew bundleRelease assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.jks -Pandroid.injected.signing.store.password=SafarAL123 -Pandroid.injected.signing.key.alias=safaral -Pandroid.injected.signing.key.password=SafarAL123 || ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SafarAI-Ready-For-PlayStore
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
            app/release.jks
