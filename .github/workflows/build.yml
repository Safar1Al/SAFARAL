name: Build SafarAI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Debug APK (No Keystore Needed)
        run: |
          mkdir -p app/src/main/java/com/safaral/app
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { compileSdk 34; namespace 'com.safaral.app'; defaultConfig { applicationId "com.safaral.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" } buildTypes { debug { } release { } } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          ./gradlew assembleDebug --no-daemon || (apt-get update && apt-get install -y gradle && gradle :app:assembleDebug)
      - uses: actions/upload-artifact@v4
        with:
          name: SafarAI-APK
          path: "**/build/outputs/apk/debug/*.apk"
