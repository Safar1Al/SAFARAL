name: Build SafarAI Global
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Find and Unzip
        run: |
          echo "=== Files in repo ==="
          ls -la
          echo "=== Find zip ==="
          find . -name "*.zip" -type f
          ZIP=$(find . -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            unzip -o "$ZIP" -d .
          else
            echo "No zip found in repo root, checking if project already unzipped"
          fi
          echo "=== After unzip ==="
          ls -la
          find . -type f -name "gradlew" 2>/dev/null
          find . -maxdepth 4 -type d -name "app" 2>/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Auto Keystore
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -1)
          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            mkdir -p "$DIR/app"
            keytool -genkey -v -keystore "$DIR/app/release.jks" -alias safaral -keyalg RSA -keysize 2048 -validity 10000 -storepass SafarAL123 -keypass SafarAL123 -dname "CN=SafarAI, O=SafarAL, C=SD" || true
          else
            mkdir -p app
            keytool -genkey -v -keystore app/release.jks -alias safaral -keyalg RSA -keysize 2048 -validity 10000 -storepass SafarAL123 -keypass SafarAL123 -dname "CN=SafarAI, O=SafarAL, C=SD" || true
          fi

      - name: Build AAB+APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found anywhere! Listing all files:"
            find . -type f | head -100
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          DIR=$(dirname "$GRADLEW_PATH")
          chmod +x "$GRADLEW_PATH"
          cd "$DIR"
          ./gradlew bundleRelease assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/release.jks -Pandroid.injected.signing.store.password=SafarAL123 -Pandroid.injected.signing.key.alias=safaral -Pandroid.injected.signing.key.password=SafarAL123 --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SafarAI-Ready-For-PlayStore
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
            **/app/release.jks
